<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>狙盘手·短线交易技术文档</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    :root {
      --primary: #c0392b;
      --primary-dark: #922b21;
      --primary-light: #e74c3c;
      --accent: #f39c12;
      --accent-light: #f9ca24;
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #1c2128;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --text-dim: #6e7681;
      --green: #27ae60;
      --red: #e74c3c;
      --sidebar-width: 280px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    /* ── 顶部导航 ── */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 58px;
      background: rgba(13,17,23,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      z-index: 100;
      gap: 16px;
    }
    .topbar-logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 18px; font-weight: 700;
      color: var(--primary-light);
      text-decoration: none;
    }
    .topbar-logo .icon { font-size: 22px; }
    .topbar-sub {
      font-size: 12px; color: var(--text-muted);
      border-left: 1px solid var(--border);
      padding-left: 16px; margin-left: 4px;
    }
    .topbar-right {
      margin-left: auto;
      display: flex; align-items: center; gap: 12px;
    }
    .badge {
      background: var(--primary);
      color: #fff;
      font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 12px;
    }
    .search-box {
      display: flex; align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 12px;
      gap: 8px;
    }
    .search-box input {
      background: none; border: none; outline: none;
      color: var(--text); font-size: 13px; width: 180px;
    }
    .search-box input::placeholder { color: var(--text-dim); }

    /* ── 侧边栏 ── */
    .layout {
      display: flex;
      padding-top: 58px;
      min-height: 100vh;
    }
    .sidebar {
      width: var(--sidebar-width);
      position: fixed;
      top: 58px; bottom: 0;
      left: 0;
      overflow-y: auto;
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      padding: 16px 0;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .nav-group { margin-bottom: 4px; }
    .nav-group-title {
      padding: 8px 20px 4px;
      font-size: 11px; font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .nav-item {
      display: flex; align-items: center;
      padding: 7px 20px;
      font-size: 13.5px;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 0;
      transition: all 0.15s;
      border-left: 2px solid transparent;
      gap: 8px;
    }
    .nav-item:hover {
      background: var(--bg-hover);
      color: var(--text);
    }
    .nav-item.active {
      color: var(--primary-light);
      border-left-color: var(--primary-light);
      background: rgba(231,76,60,0.08);
      font-weight: 500;
    }
    .nav-item .nav-icon { font-size: 14px; flex-shrink: 0; }
    .nav-badge {
      margin-left: auto;
      background: var(--bg-hover);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 10px;
      padding: 1px 6px; border-radius: 8px;
    }
    .nav-divider {
      height: 1px; background: var(--border);
      margin: 10px 16px;
    }

    /* ── 主内容 ── */
    .main {
      margin-left: var(--sidebar-width);
      flex: 1;
      padding: 40px 48px;
      max-width: 960px;
    }

    /* ── 面包屑 ── */
    .breadcrumb {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--text-dim);
      margin-bottom: 24px;
    }
    .breadcrumb span { cursor: pointer; }
    .breadcrumb span:hover { color: var(--text-muted); }
    .breadcrumb .sep { color: var(--border); }

    /* ── 页面头部 ── */
    .page-header { margin-bottom: 36px; }
    .page-title {
      font-size: 30px; font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 12px;
    }
    .page-title .title-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .page-desc {
      font-size: 15px; color: var(--text-muted);
      max-width: 640px;
    }
    .page-meta {
      display: flex; gap: 16px; margin-top: 14px;
    }
    .meta-tag {
      display: flex; align-items: center; gap: 5px;
      font-size: 12px; color: var(--text-dim);
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 3px 10px; border-radius: 6px;
    }

    /* ── 统计卡片 ── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      transition: border-color 0.2s;
    }
    .stat-card:hover { border-color: var(--primary); }
    .stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .stat-value { font-size: 26px; font-weight: 700; color: var(--text); }
    .stat-sub { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
    .stat-card.red .stat-value { color: var(--red); }
    .stat-card.gold .stat-value { color: var(--accent); }
    .stat-card.green .stat-value { color: var(--green); }

    /* ── 章节内容 ── */
    .section { margin-bottom: 40px; }
    .section-title {
      font-size: 20px; font-weight: 600;
      color: var(--text);
      margin-bottom: 16px;
      display: flex; align-items: center; gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .section-title .s-icon {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .section-num {
      font-size: 12px;
      color: var(--text-dim);
      background: var(--bg-hover);
      border: 1px solid var(--border);
      padding: 2px 8px; border-radius: 4px;
      margin-left: auto;
    }

    /* ── 内容卡片 ── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      border-color: rgba(192,57,43,0.4);
      box-shadow: 0 2px 12px rgba(192,57,43,0.1);
    }
    .card-title {
      font-size: 15px; font-weight: 600;
      color: var(--text);
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .card-body {
      font-size: 13.5px; color: var(--text-muted);
      line-height: 1.75;
    }
    .card-body ul {
      padding-left: 18px;
      margin: 6px 0;
    }
    .card-body li { margin: 4px 0; }
    .card-body strong { color: var(--text); }

    /* ── 规则列表 ── */
    .rule-list { display: flex; flex-direction: column; gap: 8px; }
    .rule-item {
      display: flex; align-items: flex-start; gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      transition: all 0.15s;
    }
    .rule-item:hover { border-color: rgba(192,57,43,0.35); }
    .rule-num {
      min-width: 26px; height: 26px;
      background: var(--primary);
      color: #fff;
      font-size: 12px; font-weight: 700;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .rule-content { flex: 1; }
    .rule-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
    .rule-desc { font-size: 13px; color: var(--text-muted); line-height: 1.6; }

    /* ── 警告/提示块 ── */
    .alert {
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 14px;
      border-left: 3px solid;
      font-size: 13.5px;
    }
    .alert-warning {
      background: rgba(243,156,18,0.08);
      border-color: var(--accent);
      color: #f0c060;
    }
    .alert-danger {
      background: rgba(231,76,60,0.08);
      border-color: var(--red);
      color: #e88070;
    }
    .alert-success {
      background: rgba(39,174,96,0.08);
      border-color: var(--green);
      color: #60c080;
    }
    .alert-info {
      background: rgba(52,152,219,0.08);
      border-color: #3498db;
      color: #80b8e8;
    }
    .alert strong { font-weight: 700; display: block; margin-bottom: 4px; }

    /* ── 双列网格 ── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 14px; }

    /* ── 标签 ── */
    .tag {
      display: inline-block;
      font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 4px;
      margin-right: 4px;
    }
    .tag-red { background: rgba(231,76,60,0.15); color: var(--red); border: 1px solid rgba(231,76,60,0.3); }
    .tag-green { background: rgba(39,174,96,0.15); color: var(--green); border: 1px solid rgba(39,174,96,0.3); }
    .tag-gold { background: rgba(243,156,18,0.15); color: var(--accent); border: 1px solid rgba(243,156,18,0.3); }
    .tag-blue { background: rgba(52,152,219,0.15); color: #5dade2; border: 1px solid rgba(52,152,219,0.3); }
    .tag-gray { background: var(--bg-hover); color: var(--text-dim); border: 1px solid var(--border); }

    /* ── 关键词高亮 ── */
    .hl { color: var(--accent); font-weight: 600; }
    .hl-red { color: var(--red); font-weight: 600; }
    .hl-green { color: var(--green); font-weight: 600; }

    /* ── 进度指示器 ── */
    .progress-list { display: flex; flex-direction: column; gap: 10px; }
    .progress-item { }
    .progress-header {
      display: flex; justify-content: space-between;
      font-size: 13px; color: var(--text-muted);
      margin-bottom: 5px;
    }
    .progress-bar {
      height: 6px; background: var(--border); border-radius: 3px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 1s ease;
    }

    /* ── Tab ── */
    .tabs { margin-bottom: 20px; }
    .tab-header {
      display: flex; gap: 2px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .tab-btn {
      padding: 8px 18px;
      font-size: 13px; cursor: pointer;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      border-radius: 4px 4px 0 0;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      color: var(--primary-light);
      border-bottom-color: var(--primary-light);
      background: rgba(231,76,60,0.05);
    }

    /* ── 表格 ── */
    .doc-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .doc-table th {
      background: var(--bg-hover);
      color: var(--text-muted);
      font-weight: 600;
      padding: 10px 14px;
      text-align: left;
      border: 1px solid var(--border);
    }
    .doc-table td {
      padding: 9px 14px;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .doc-table tr:hover td { background: var(--bg-hover); color: var(--text); }

    /* ── 首页英雄区 ── */
    .hero {
      background: linear-gradient(135deg, rgba(192,57,43,0.15) 0%, rgba(13,17,23,0) 60%);
      border: 1px solid rgba(192,57,43,0.2);
      border-radius: 14px;
      padding: 36px 40px;
      margin-bottom: 32px;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute; top: -40px; right: -40px;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(192,57,43,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-title {
      font-size: 28px; font-weight: 800; color: var(--text);
      margin-bottom: 10px;
    }
    .hero-title span { color: var(--primary-light); }
    .hero-sub { font-size: 15px; color: var(--text-muted); max-width: 520px; }
    .hero-motto {
      margin-top: 18px;
      font-size: 18px; font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.05em;
    }

    /* ── 章节卡片网格（首页导航） ── */
    .chapter-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }
    .chapter-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .chapter-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(192,57,43,0.15);
    }
    .chapter-card .cc-icon { font-size: 22px; margin-bottom: 8px; }
    .chapter-card .cc-title {
      font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px;
    }
    .chapter-card .cc-desc {
      font-size: 12px; color: var(--text-dim); line-height: 1.5;
    }
    .chapter-card .cc-count {
      margin-top: 8px;
      font-size: 11px; color: var(--text-dim);
    }

    /* ── 汉堡菜单按钮 ── */
    .menu-btn {
      display: none;
      align-items: center; justify-content: center;
      width: 36px; height: 36px;
      border-radius: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .menu-btn:hover { background: var(--bg-hover); }
    .menu-btn .menu-icon {
      display: flex; flex-direction: column; gap: 4px;
    }
    .menu-btn .menu-icon span {
      display: block; width: 16px; height: 2px;
      background: var(--text-muted); border-radius: 1px;
      transition: all 0.25s;
      transform-origin: center;
    }
    .menu-btn.open .menu-icon span:nth-child(1) {
      transform: translateY(6px) rotate(45deg);
    }
    .menu-btn.open .menu-icon span:nth-child(2) {
      opacity: 0; transform: scaleX(0);
    }
    .menu-btn.open .menu-icon span:nth-child(3) {
      transform: translateY(-6px) rotate(-45deg);
    }

    /* ── 移动端搜索图标 ── */
    .search-icon-btn {
      display: none;
      align-items: center; justify-content: center;
      width: 36px; height: 36px;
      border-radius: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 15px;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .search-icon-btn:hover { background: var(--bg-hover); }

    /* ── 移动端搜索展开条 ── */
    .mobile-search-bar {
      display: none;
      position: fixed;
      top: 58px; left: 0; right: 0;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      z-index: 99;
      animation: slideDown 0.2s ease;
    }
    .mobile-search-bar.show { display: flex; }
    .mobile-search-bar input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      color: var(--text); font-size: 14px;
      outline: none;
    }
    .mobile-search-bar input::placeholder { color: var(--text-dim); }
    .mobile-search-close {
      margin-left: 10px;
      padding: 0 12px;
      color: var(--text-muted);
      cursor: pointer; font-size: 13px;
      white-space: nowrap;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── 侧边栏遮罩 ── */
    .sidebar-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 149;
      backdrop-filter: blur(2px);
    }
    .sidebar-overlay.show { display: block; }

    /* 响应式 */
    @media (max-width: 1100px) {
      .main { padding: 28px 24px; }
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
      .chapter-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      /* topbar 移动端布局 */
      .topbar { padding: 0 14px; gap: 10px; }
      .topbar-sub { display: none; }
      .badge { display: none; }
      .search-box { display: none; }
      .topbar-right { gap: 8px; }
      .menu-btn { display: flex; }
      .search-icon-btn { display: flex; }

      /* 侧边栏：默认隐藏，通过 .open 类滑入 */
      .sidebar {
        display: block;
        left: -100%;
        width: min(280px, 82vw);
        top: 0; bottom: 0;
        z-index: 150;
        transition: left 0.28s cubic-bezier(0.4,0,0.2,1);
        padding-top: 16px;
        box-shadow: 4px 0 24px rgba(0,0,0,0.4);
      }
      .sidebar.open { left: 0; }

      /* 主内容 */
      .main { margin-left: 0; padding: 20px 16px; }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .stat-grid { grid-template-columns: 1fr 1fr; }
      .hero { padding: 22px 20px; }
      .hero-title { font-size: 22px; }
      .hero-motto { font-size: 15px; }
      .chapter-grid { grid-template-columns: 1fr 1fr; }
      .page-title { font-size: 22px; }
      .doc-table { font-size: 12px; }
      .doc-table th, .doc-table td { padding: 7px 8px; }
    }
    @media (max-width: 400px) {
      .chapter-grid { grid-template-columns: 1fr; }
      .stat-grid { grid-template-columns: 1fr 1fr; }
      .topbar-logo { font-size: 15px; }
    }

    /* 滚动动画 */
    .fade-in { animation: fadeIn 0.4s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<div id="app">
  <!-- 顶部导航 -->
  <nav class="topbar">
    <button class="menu-btn" :class="{ open: sidebarOpen }" @click="toggleSidebar" aria-label="菜单">
      <div class="menu-icon">
        <span></span><span></span><span></span>
      </div>
    </button>
    <a class="topbar-logo" @click="goHome">
      <span class="icon">🎯</span>
      狙盘手
    </a>
    <span class="topbar-sub">短线交易技术文档 v2.0</span>
    <div class="topbar-right">
      <div class="search-box">
        <span>🔍</span>
        <input v-model="searchQuery" placeholder="搜索技术要点..." @input="handleSearch" />
      </div>
      <button class="search-icon-btn" @click="toggleMobileSearch" aria-label="搜索">🔍</button>
      <span class="badge">185页精华</span>
    </div>
  </nav>

  <!-- 移动端搜索展开条 -->
  <div class="mobile-search-bar" :class="{ show: mobileSearchOpen }">
    <input
      v-model="searchQuery"
      placeholder="搜索技术要点..."
      @input="handleSearch"
      ref="mobileSearchInput"
      autofocus
    />
    <span class="mobile-search-close" @click="closeMobileSearch">取消</span>
  </div>

  <!-- 侧边栏遮罩 -->
  <div class="sidebar-overlay" :class="{ show: sidebarOpen }" @click="closeSidebar"></div>

  <div class="layout" :style="mobileSearchOpen ? 'padding-top: calc(58px + 54px)' : ''">
    <!-- 侧边栏 -->
    <aside class="sidebar" :class="{ open: sidebarOpen }">
      <div class="nav-group">
        <div class="nav-group-title">快速导航</div>
        <div class="nav-item" :class="{ active: currentPage === 'home' }" @click="navigate('home'); closeSidebar()">
          <span class="nav-icon">🏠</span> 文档首页
        </div>
